[workspace]
authors = ["barkure <43804451+barkure@users.noreply.github.com>"]
channels = ["conda-forge"]
name = "rtm-guided-incremental-inv"
platforms = ["linux-64"]
version = "0.1.0"

[tasks]
train = "python train.py"
evaluate = "python evaluate.py"
generate-forward = "python scripts/generate_forward_dataset.py"
robustness = "python scripts/evaluate_robustness.py"

[dependencies]
python = "3.12.*"

[target.linux-64.pypi-dependencies]
torch = { version = "==2.13.*", index = "https://download.pytorch.org/whl/cu130" }
numpy = "==2.4.*"
scipy = "==1.18.*"
matplotlib = "==3.11.*"
deepwave = "==0.0.27"

[pypi-dependencies]
pip = ">=26.1.2, <27"
